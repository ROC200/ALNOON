<style>

  --paper:#fdf4ec; --surface:#ffffff; --line:#f0ddc8;
  --text:#3a2416; --muted:#8a7160;
  --brand:#e2751e; --brand-deep:#b95c14;

@media (prefers-color-scheme: dark){

*{box-sizing:border-box}
html,body{height:100%}
body{ margin:0; background:var(--paper); color:var(--text); font-family:'Cairo','Tahoma',sans-serif; display:flex; justify-content:center; }
#app{width:100%; max-width:520px; min-height:100%; display:flex; flex-direction:column;}
.topbar{ position:sticky; top:0; z-index:5; padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:space-between; }
.topbar h2{margin:0; font-size:1.05rem; font-weight:800;}
.topbar button{ background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:9px; padding:8px 12px; font-size:.82rem; cursor:pointer; font-family:inherit; }
.wrap{padding:18px 16px 40px; flex:1;}
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
.field-label{display:block; font-size:.85rem; color:var(--muted); margin:2px 0 8px; font-weight:600;}
input[type=text],input[type=tel],input[type=password]{ width:100%; padding:14px; font-size:1.1rem; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--text); margin-bottom:16px; text-align:center; font-family:inherit; }

.btn-secondary{flex:1; padding:16px; border:1px solid var(--line); background:var(--paper); color:var(--text); border-radius:13px; font-weight:700; cursor:pointer; font-family:inherit; font-size:1rem;}
.confirm-row{display:flex; gap:8px; margin-top:12px;}
.center{text-align:center}
.muted{color:var(--muted); font-size:.85rem;}
.err{color:var(--danger); font-size:.9rem; margin-top:8px;}
.phone-display{font-size:1.3rem; font-weight:800; text-align:center; margin-bottom:4px; direction:ltr;}
.dots{display:flex; gap:8px; justify-content:center; margin:14px 0;}
.dot{width:26px; height:26px; border-radius:50%; background:var(--line); display:flex; align-items:center; justify-content:center; font-size:.78rem; color:var(--muted);}
.dot.filled{background:var(--brand); color:#fff; font-size:1rem; font-weight:800;}
.dot.gift{background:linear-gradient(135deg,var(--gold),var(--gold-deep)); font-size:1rem;}
.free{ background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#231a00; padding:14px; border-radius:12px; text-align:center; font-weight:800; margin-top:12px; }

.stat-box{flex:1; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 6px; text-align:center;}
.stat-num{font-size:1.35rem; font-weight:800; color:var(--brand);}
.stat-label{font-size:.76rem; color:var(--muted); margin-top:2px;}
.section-title{font-size:.95rem; font-weight:800; margin:4px 0 12px;}
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.bar-label{width:84px; font-size:.82rem; color:var(--muted); flex-shrink:0;}
.bar-track{flex:1; height:14px; background:var(--paper); border-radius:7px; overflow:hidden;}
.bar-fill{height:100%; background:var(--brand); border-radius:7px;}
.bar-fill.max{background:var(--gold-deep);}
.bar-value{width:26px; text-align:left; font-size:.8rem; font-weight:700;}
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:20px;}
input[type=month]{width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--text); font-family:inherit; font-size:1rem; margin-bottom:4px;}
textarea{width:100%; padding:14px; font-size:1rem; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--text); margin-bottom:12px; font-family:inherit; resize:vertical; min-height:80px;}
.dist-table{width:100%; border-collapse:collapse; margin-top:8px;}
.dist-table td{padding:8px 6px; border-bottom:1px solid var(--line); font-size:.9rem;}
.dist-table td:last-child{text-align:left; font-weight:800; color:var(--brand);}

};

const REWARD_EVERY = 3; // كل 3 زيارات، الرابعة مجانية

// ====== WalletWallet — يتصل مباشرة من المتصفح (بدون Cloud Functions) ======
const WW_API_KEY = "ww_live_0bbff023742852f5ad3a93e5eca84254";
const WW_BASE = "https://api.walletwallet.dev";
const STORE_MAPS_URL = "https://maps.app.goo.gl/WS8JH4buvnsDgY8fA";
// أيقونة الإشعار (برتقالي وحرف ن أبيض) — ملف icon.png في المستودع.
// الصور من ميزات Pro في WalletWallet؛ لو رفضها الحساب، البطاقة تنرسل بدون الأيقونة تلقائيًا.
const USE_BRAND_ICON = true;
// لازم رابط https — نستخدم الملف من GitHub مباشرة عشان يشتغل مهما كان رابط الموقع
const BRAND_ICON_URL = "https://raw.githubusercontent.com/ROC200/ALNOON/main/icon.png";
let lastIconError = ""; // سبب رفض الأيقونة (لو صار) عشان يطلع للمستخدم

async function getCurrentOfferText(){
  try{ const snap = await getDoc(doc(firestore,"settings","currentOffer")); return snap.exists() ? (snap.data().text||"") : ""; }
  catch(e){ return ""; }
}

async function syncCardToWallet(phone, cardData){
  const offerText = await getCurrentOfferText();
  const rem = Math.min(cardData.sinceReward||0, REWARD_EVERY);
  // شكل البطاقة: سيارة صغيرة فوق "مغسلة النون" الكبير، تحته الأختام والمكافأة والعرض، وخلف البطاقة رابط الموقع
  const body = {
    title: "مغسلة النون", // يطلع فوق البطاقة وعنوان الإشعار
    organizationName: "مغسلة النون 🚗", // اسم المرسل في الإشعار
    label: "🚗",
    value: "مغسلة النون",
    barcodeValue: phone,
    barcodeFormat: "QR",
    colorPreset: "orange",
    // changeMessage: لما يتغير الحقل يطلع إشعار على جوال العميل بالنص الجديد (%@ = القيمة)
    secondaryFields: [
      { label:"الأختام", value: stampsText(rem) },
      { label:"الرصيد", value: loyaltyMessage(rem, false), changeMessage: "%@" },
      { label:"عرض اليوم", value: offerText || "لا يوجد عرض حاليًا", changeMessage: "%@" }
    ],
    backFields: [
      { label:"📍 موقع المغسلة", value: STORE_MAPS_URL },
      { label:"نظام الولاء", value: "ثلاثة زيارات والرابعة مجانًا 🎁" }
    ]
  };

  if(USE_BRAND_ICON) body.iconURL = BRAND_ICON_URL;

  const headers = { "Content-Type":"application/json", "Authorization":`Bearer ${WW_API_KEY}` };
  // يرسل الطلب، ولو فشل بسبب الأيقونة (مثلاً انتهت التجربة) يعيده بدونها
  const send = async (url, method) => {
    lastIconError = "";
    let res = await fetch(url, { method, headers, body: JSON.stringify(body) });
    if(!res.ok && body.iconURL){
      const why = await res.clone().json().catch(()=>({}));
      lastIconError = `WalletWallet ${res.status}: ${why.error || why.message || JSON.stringify(why)}`;
      delete body.iconURL;
      res = await fetch(url, { method, headers, body: JSON.stringify(body) });
    }
    return res;
  };
  if(!cardData.wwSerial){
    const res = await send(`${WW_BASE}/api/passes`, "POST");
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(`WalletWallet ${res.status}: ${data.error || data.message || JSON.stringify(data)}`);
    // WalletWallet يرجّع serialNumber و shareUrl (مو serial / shareLink)
    const serial = data.serialNumber || data.serial;
    const shareLink = data.shareUrl || (serial ? `${WW_BASE}/p/${serial}` : null);
    if(!serial || !shareLink) throw new Error("WalletWallet: الرد ما فيه serialNumber/shareUrl " + JSON.stringify(data));
    await setDoc(doc(firestore,"cards",phone), { wwSerial: serial, wwShareLink: shareLink, walletAdded:true }, { merge:true });
    return shareLink;
  }else{
    const res = await send(`${WW_BASE}/api/passes/${cardData.wwSerial}`, "PUT");
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(`WalletWallet ${res.status}: ${data.error || data.message || JSON.stringify(data)}`);
    return data.shareUrl || cardData.wwShareLink || `${WW_BASE}/p/${cardData.wwSerial}`;
  }
}
// ============================================================================
const EN_WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const fbApp = initializeApp(firebaseConfig);
const firestore = getFirestore(fbApp);
const auth = getAuth(fbApp);

async function getStaffInfo(uid){
  try{ const snap = await getDoc(doc(firestore,"staff",uid)); return snap.exists() ? snap.data() : null; }
  catch(e){ return null; }
}

function pad(n){ return n<10 ? "0"+n : ""+n; }
function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function startOfWeek(d){ const c=new Date(d.getFullYear(),d.getMonth(),d.getDate()); c.setDate(c.getDate()-c.getDay()); return c; }
function fmtHour(h){ const period = h<12 ? "ص" : "م"; let hh = h%12; if(hh===0) hh=12; return hh+":00 "+period; }
const EN_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthLabel(mk){ const [y,m] = mk.split("-").map(Number); return EN_MONTHS[m-1]+" "+y; }
function normalizePhone(raw){
  let p = (raw||"").trim()
    .replace(/[٠-٩]/g, c => String(c.charCodeAt(0)-0x0660))
    .replace(/[۰-۹]/g, c => String(c.charCodeAt(0)-0x06F0))
    .replace(/[^\d]/g,"");
  if(p.startsWith("00966")) p = "0"+p.slice(5);
  else if(p.startsWith("966")) p = "0"+p.slice(3);
  else if(p.length===9 && p.startsWith("5")) p = "0"+p;
  return p;
}
function isValidPhone(p){ return /^05\d{8}$/.test(p); }

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

function topbar(title, badge){
  return `<div class="topbar"><div><h2>${title}</h2>${badge?`<div style="font-size:.78rem;opacity:.9">${badge}</div>`:""}</div><button id="logoutBtn">خروج</button></div>`;
}
function bindLogout(wrap){ const b=wrap.querySelector("#logoutBtn"); if(b) b.onclick=()=>signOut(auth); }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="login-wrap"><p class="muted center">جاري التحقق من الدخول...</p></div>`;
  onAuthStateChanged(auth, async (user) => {
    app.innerHTML = "";
    if(!user){ app.appendChild(renderLogin()); return; }
    const staff = await getStaffInfo(user.uid);
    if(!staff){
      app.appendChild(el(`<div class="login-wrap"><div class="card center">
        <p class="err">حسابك ما له صلاحية بعد. تواصل مع المسؤول.</p>
        <button class="big-btn" id="signOutBtn">خروج</button>
      </div></div>`));
      document.getElementById("signOutBtn").onclick = () => signOut(auth);
      return;
    }
    if(staff.role === "owner") app.appendChild(renderOwner());
    else app.appendChild(renderWorker());
  });
}

function renderLogin(){
  const wrap = el(`<div class="login-wrap">
    <div class="card" style="width:100%">
      <h2 class="center" style="margin-top:0">🚗 مغسلة النون</h2>
      <label class="field-label">البريد الإلكتروني</label>
      <input type="text" id="email" placeholder="البريد الإلكتروني الخاص بحسابك" autocomplete="username">
      <label class="field-label">كلمة المرور</label>
      <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password">
      <button class="big-btn" id="loginBtn">دخول</button>
      <div id="loginErr"></div>
    </div>
  </div>`);
  const doLogin = async () => {
    const email = wrap.querySelector("#email").value.trim();
    const pw = wrap.querySelector("#pw").value;
    const errBox = wrap.querySelector("#loginErr");
    const btn = wrap.querySelector("#loginBtn");
    if(!email || !pw){ errBox.innerHTML = `<p class="err center">أدخل البريد وكلمة المرور</p>`; return; }
    btn.disabled = true; btn.textContent = "جاري الدخول...";
    try{ await signInWithEmailAndPassword(auth, email, pw); }
    catch(e){ errBox.innerHTML = `<p class="err center">بيانات الدخول غير صحيحة</p>`; btn.disabled=false; btn.textContent="دخول"; }
  };
  wrap.querySelector("#loginBtn").onclick = doLogin;
  wrap.querySelector("#pw").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  return wrap;
}

// sinceReward: 0..3 — لما يوصل 3 يعني الغسلة الجاية (الرابعة) مجانية
function stampsText(sinceReward){
  const n = Math.min(sinceReward||0, REWARD_EVERY);
  let out = [];
  for(let i=1;i<=REWARD_EVERY;i++) out.push(i<=n ? "❌" : "⬜");
  if(n >= REWARD_EVERY) out.push("🎁");
  return out.join(" ");
}

function loyaltyMessage(sinceReward, isFree){
  const remaining = isFree ? 0 : (REWARD_EVERY - sinceReward);
  if(isFree) return `🎉 مبروك! هذي الغسلة مجانية`;
  if(remaining <= 0) return `🎁 مبروك! الغسلة الجاية مجانية`;
  if(remaining === 1) return `ثلاثة زيارات والرابعة مجانًا - متبقي زيارة واحدة لمكافأتك`;
  if(remaining === 2) return `ثلاثة زيارات والرابعة مجانًا - متبقي زيارتين لمكافأتك`;
  return `ثلاثة زيارات والرابعة مجانًا - متبقي ${remaining} زيارات لمكافأتك`;
}

function cardStatusHtml(total, sinceReward, isFree){
  let dotsHtml = "";
  const filled = isFree ? REWARD_EVERY : sinceReward;
  for(let i=1;i<=REWARD_EVERY;i++) dotsHtml += `<div class="dot ${i<=filled?"filled":""}">${i<=filled?"✕":i}</div>`;
  if(filled >= REWARD_EVERY) dotsHtml += `<div class="dot gift">🎁</div>`;
  return `
    <p class="center muted">إجمالي الزيارات: ${total}</p>
    <div class="dots">${dotsHtml}</div>
    ${isFree || sinceReward >= REWARD_EVERY ? `<div class="free">${loyaltyMessage(sinceReward,isFree)}</div>` : `<p class="center muted">${loyaltyMessage(sinceReward,false)}</p>`}
  `;
}

    </div>
  `;
}

async function renderCustomerView(phone){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="login-wrap"><div class="card center" style="width:100%"><p class="muted center">جاري التحميل...</p></div></div>`;
  const box = document.querySelector("#app .card");
  try{
    if(!auth.currentUser){ await signInAnonymously(auth); }
    const snap = await getDoc(doc(firestore,"cards",phone));
    if(!snap.exists()){
      box.innerHTML = `<h2 class="center" style="margin-top:0">🚗 مغسلة النون</h2><p class="muted center">ما فيه سجل لهذا الرقم بعد.</p>`;
    }else{
      const d = snap.data();
      box.innerHTML = `<h2 class="center" style="margin-top:0">🚗 مغسلة النون</h2><div class="phone-display">${phone}</div>` + cardStatusHtml(d.total||0, d.sinceReward||0, false);
    }
  }catch(e){
    box.innerHTML = `<p class="err center">تعذر تحميل بيانات البطاقة</p>`;
  }
}

function renderWorker(){
  const wrap = el(`<div>

    <div class="wrap">
      <div class="card">
        <label class="field-label">رقم جوال العميل</label>

        <div id="result"></div>
      </div>
      <div class="card">
        <p class="section-title">استعلام عن عميل (بدون تسجيل غسلة جديدة)</p>
        <input type="tel" id="lookupPhone" placeholder="05XXXXXXXX" autocomplete="off">

        <div id="lookupResult"></div>
      </div>
    </div>
  </div>`);
  bindLogout(wrap);

  const btn = wrap.querySelector("#submit");
  const confirmArea = wrap.querySelector("#confirmArea");
  const resultBox = wrap.querySelector("#result");
  const phoneInput = wrap.querySelector("#phone");

  function bindSeg(segId){
    const seg = wrap.querySelector(segId);
    seg.querySelectorAll(".seg-btn").forEach(b => {
      b.onclick = () => { seg.querySelectorAll(".seg-btn").forEach(x=>x.classList.remove("active")); b.classList.add("active"); };
    });
    return () => seg.querySelector(".seg-btn.active").dataset.v;
  }
  const getSize = bindSeg("#sizeSeg");
  const getType = bindSeg("#typeSeg");

  btn.onclick = () => {
    const phone = normalizePhone(phoneInput.value);
    if(!phone){ resultBox.innerHTML = `<p class="err">أدخل رقم الجوال</p>`; return; }
    if(!isValidPhone(phone)){ resultBox.innerHTML = `<p class="err">رقم الجوال لازم يكون 10 أرقام ويبدأ بـ 05</p>`; return; }
    resultBox.innerHTML = "";
    const size = getSize(), type = getType();
    confirmArea.innerHTML = `
      <div class="card" style="background:var(--paper); margin-top:12px;">
        <p class="center muted" style="margin-top:0">تأكيد قبل التسجيل</p>
        <div class="phone-display">${phone}</div>
        <p class="center muted">${size} · ${type}</p>
        <div class="confirm-row">
          <button class="big-btn" id="confirmYes" style="flex:1">تأكيد وتسجيل</button>
          <button class="btn-secondary" id="confirmNo">تعديل</button>
        </div>
      </div>`;
    wrap.querySelector("#confirmNo").onclick = () => { confirmArea.innerHTML = ""; };
    wrap.querySelector("#confirmYes").onclick = async () => {
      const yesBtn = wrap.querySelector("#confirmYes");
      yesBtn.disabled = true; yesBtn.textContent = "جاري التسجيل...";
      try{
        const now = new Date();
        const visitData = { phone, carSize:size, washType:type, dateKey: fmtDate(now), month: monthKey(now), weekday: now.getDay(), hour: now.getHours(), ts: now.toISOString() };
        await addDoc(collection(firestore,"visits"), visitData);

        const cardRef = doc(firestore,"cards",phone);
        const snap = await getDoc(cardRef);
        const prev = snap.exists() ? snap.data() : {};
        const prevSince = prev.sinceReward || 0;
        let total = (prev.total||0)+1;
        let sinceReward, isFree;
        if(prevSince >= REWARD_EVERY){ isFree = true; sinceReward = 0; } // هذي الزيارة نفسها مجانية (بعد 3 مدفوعة)
        else { isFree = false; sinceReward = prevSince + 1; }
        await setDoc(cardRef, { phone, total, sinceReward, lastVisit: visitData.ts }, { merge: true });

        let shareLink = null, walletErr = "";
        try{ shareLink = await syncCardToWallet(phone, { total, sinceReward, wwSerial: prev.wwSerial, wwShareLink: prev.wwShareLink }); }
        catch(e){ console.error("WalletWallet sync failed", e); walletErr = (e && e.message) || "خطأ غير معروف"; }

        const iconNote = lastIconError ? `<p class="muted center">⚠️ الأيقونة ما انقبلت (${lastIconError.replace(/</g,"&lt;")}) — <a href="${BRAND_ICON_URL}" target="_blank" rel="noopener">افتح رابط الأيقونة</a></p>` : "";
        resultBox.innerHTML = `<div class="phone-display">${phone}</div>` + cardStatusHtml(total, sinceReward, isFree) + iconNote
          + (shareLink ? walletDirectQrHtml(shareLink)
             : `<p class="err center">تعذر إنشاء بطاقة Wallet: ${walletErr.replace(/</g,"&lt;")}</p>` + customerLinkHtml(phone));
        phoneInput.value = "";
      }catch(e){
        resultBox.innerHTML = `<p class="err">حدث خطأ أثناء التسجيل: ${(e && e.code) || "غير معروف"}</p>`;
      }
      confirmArea.innerHTML = "";
    };
  };

  const lookupBtn = wrap.querySelector("#lookupBtn");
  const lookupResult = wrap.querySelector("#lookupResult");
  lookupBtn.onclick = async () => {
    const phone = normalizePhone(wrap.querySelector("#lookupPhone").value);
    if(!phone){ lookupResult.innerHTML = `<p class="err">أدخل رقم الجوال</p>`; return; }
    if(!isValidPhone(phone)){ lookupResult.innerHTML = `<p class="err">رقم الجوال لازم يكون 10 أرقام ويبدأ بـ 05</p>`; return; }
    lookupBtn.disabled = true; lookupBtn.textContent = "جاري البحث...";
    try{
      const snap = await getDoc(doc(firestore,"cards",phone));
      if(!snap.exists()){ lookupResult.innerHTML = `<p class="muted center">ما فيه سجل لهذا الرقم بعد.</p>`; }
      else{ const d = snap.data(); lookupResult.innerHTML = `<div class="phone-display">${phone}</div>` + cardStatusHtml(d.total||0, d.sinceReward||0, false) + (d.wwShareLink ? walletDirectQrHtml(d.wwShareLink) : ""); }
    }catch(e){ lookupResult.innerHTML = `<p class="err">تعذر البحث</p>`; }
    lookupBtn.disabled = false; lookupBtn.textContent = "استعلام";
  };
  return wrap;
}

function yearOptions(selected){
  const now = new Date().getFullYear(); let o = "";
  for(let y=now; y>=now-3; y--) o += `<option value="${y}" ${y===selected?"selected":""}>${y}</option>`;
  return o;
}
function monthOptions(selected){ return EN_MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===selected?"selected":""}>${m}</option>`).join(""); }
function daySelectsHtml(){
  const now = new Date(); let days = `<option value="">Day</option>`;
  for(let d=1; d<=31; d++) days += `<option value="${d}">${d}</option>`;
  return `<select data-p="d">${days}</select><select data-p="m">${monthOptions(now.getMonth()+1)}</select><select data-p="y">${yearOptions(now.getFullYear())}</select>`;
}
function monthSelectsHtml(mk){
  const [y,m] = mk.split("-").map(Number);
  return `<select data-p="m">${monthOptions(m)}</select><select data-p="y">${yearOptions(y)}</select>`;
}
function readDateRow(row){ const v = {}; row.querySelectorAll("select").forEach(s => v[s.dataset.p] = s.value); return v; }

function renderOwner(){
  const defaultMonthValue = monthKey(new Date());
  const wrap = el(`<div>
    ${topbar("لوحة إحصائيات المالك")}
    <div class="wrap">
      <div class="card">
        <p class="section-title">إرسال عرض لكل العملاء</p>
        <div id="currentOfferBox" class="offer-box" style="display:none;">
          <p class="muted" style="margin:0 0 6px">العرض الحالي المنشور:</p>
          <p id="currentOfferText" style="margin:0; font-weight:700;"></p>
        </div>
        <textarea id="offerInput" placeholder="اكتب عرضك هنا، مثلاً: خصم 20% اليوم من 4 إلى 8 مساءً"></textarea>
        <button class="big-btn" id="publishOfferBtn">نشر العرض لكل العملاء</button>
        <div id="offerMsg"></div>
      </div>

      <div class="card">
        <label class="field-label">يوم محدد</label>
        <div class="date-row" id="dayFilter">${daySelectsHtml()}</div>
        <div id="dayResult" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <label class="field-label">الشهر</label>
        <div class="date-row" id="monthFilter">${monthSelectsHtml(defaultMonthValue)}</div>
      </div>
      <div id="ownerBody"><p class="muted center">جاري التحميل...</p></div>

      <div class="card">
        <p class="section-title">حذف العملاء غير النشطين</p>
        <p class="muted" style="margin-top:0">يحذف بطاقات العملاء اللي ما زاروا من فترة، عشان ما توصلهم العروض. سجل الغسلات والإحصائيات ما تتأثر.</p>
        <label class="field-label">ما زاروا من</label>
        <div class="seg" id="inactiveSeg" style="display:flex; gap:8px; margin-bottom:12px;">
          <button class="seg-btn" data-v="3">3 شهور</button>
          <button class="seg-btn active" data-v="6">6 شهور</button>
          <button class="seg-btn" data-v="12">سنة</button>
        </div>
        <button class="btn-secondary" id="findInactiveBtn" style="width:100%">بحث</button>
        <div id="inactiveResult"></div>
      </div>
    </div>
  </div>`);
  bindLogout(wrap);
  loadOwnerStats(wrap);
  bindOfferComposer(wrap);
  bindInactiveCleanup(wrap);

function bindInactiveCleanup(wrap){
  const seg = wrap.querySelector("#inactiveSeg");
  seg.querySelectorAll(".seg-btn").forEach(b => {
    b.onclick = () => { seg.querySelectorAll(".seg-btn").forEach(x=>x.classList.remove("active")); b.classList.add("active"); wrap.querySelector("#inactiveResult").innerHTML = ""; };
  });
  const findBtn = wrap.querySelector("#findInactiveBtn");
  const out = wrap.querySelector("#inactiveResult");
  findBtn.onclick = async () => {
    const months = Number(seg.querySelector(".seg-btn.active").dataset.v);
    const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - months);
    findBtn.disabled = true; findBtn.textContent = "جاري البحث...";
    try{
      const cardsSnap = await getDocs(collection(firestore,"cards"));
      const inactive = cardsSnap.docs.filter(d => { const lv = d.data().lastVisit; return !lv || new Date(lv) < cutoff; });
      if(!inactive.length){ out.innerHTML = `<p class="muted center" style="margin-top:10px">ما فيه عملاء غير نشطين ✅</p>`; }
      else{
        out.innerHTML = `
          <p class="center" style="margin:12px 0 4px; font-weight:800;">${inactive.length} عميل ما زاروا من ${months===12 ? "سنة" : months+" شهور"}</p>
          <details><summary class="muted" style="cursor:pointer">عرض الأرقام</summary><div class="customer-list">${inactive.map(d=>`<div>${d.id}</div>`).join("")}</div></details>
          <button class="big-btn" id="deleteInactiveBtn" style="margin-top:12px; background:var(--danger)">حذف ${inactive.length} عميل</button>
          <div id="deleteInactiveMsg"></div>`;
        const delBtn = out.querySelector("#deleteInactiveBtn");
        delBtn.onclick = async () => {
          if(!confirm(`متأكد تحذف ${inactive.length} عميل؟ ما تقدر ترجعهم.`)) return;
          delBtn.disabled = true; delBtn.textContent = "جاري الحذف...";
          let done = 0, failed = 0;
          await Promise.all(inactive.map(d => deleteDoc(doc(firestore,"cards",d.id)).then(()=>done++).catch(e=>{ console.error("delete failed", d.id, e); failed++; })));
          out.innerHTML = `<p class="muted center" style="margin-top:10px">${failed ? "⚠️" : "✅"} انحذف ${done} عميل${failed ? ` — وفشل ${failed} (تأكد من صلاحيات Firestore)` : ""}</p>`;
        };
      }
    }catch(e){ out.innerHTML = `<p class="err center">تعذر البحث: ${(e && e.code) || "غير معروف"}</p>`; }
    findBtn.disabled = false; findBtn.textContent = "بحث";
  };
}

async function bindOfferComposer(wrap){
  const offerBox = wrap.querySelector("#currentOfferBox");
  const offerTextEl = wrap.querySelector("#currentOfferText");
  const offerInput = wrap.querySelector("#offerInput");
  const offerMsg = wrap.querySelector("#offerMsg");
  const btn = wrap.querySelector("#publishOfferBtn");

  try{
    const snap = await getDoc(doc(firestore,"settings","currentOffer"));
    if(snap.exists() && snap.data().text){
      offerBox.style.display = "block";
      offerTextEl.textContent = snap.data().text;
      offerInput.value = snap.data().text;
    }
  }catch(e){ /* تجاهل، مو حرج */ }

  btn.onclick = async () => {
    const text = offerInput.value.trim();
    if(!text){ offerMsg.innerHTML = `<p class="err">اكتب نص العرض أول</p>`; return; }
    btn.disabled = true; btn.textContent = "جاري النشر...";
    try{
      await setDoc(doc(firestore,"settings","currentOffer"), { text, updatedAt: new Date().toISOString() });
      offerBox.style.display = "block";
      offerTextEl.textContent = text;
      offerMsg.innerHTML = `<p class="muted center" style="margin-top:8px">جاري إرسال التحديث لبطاقات العملاء...</p>`;

      const cardsSnap = await getDocs(collection(firestore,"cards"));
      const withWallet = cardsSnap.docs.filter(d => d.data().wwSerial);
      let done = 0; const errors = [];
      await Promise.all(withWallet.map(d => syncCardToWallet(d.id, d.data()).then(()=>done++).catch(e=>{ console.error("broadcast failed for", d.id, e); errors.push((e && e.message) || "خطأ غير معروف"); })));

      offerMsg.innerHTML = `<p class="muted center" style="margin-top:8px">${errors.length ? "⚠️" : "✅"} تم النشر — تحدثت ${done} من ${withWallet.length} بطاقة</p>`
        + (errors.length ? `<p class="err center">سبب الفشل: ${errors[0].replace(/</g,"&lt;")}</p>` : "")
        + (lastIconError ? `<p class="muted center">⚠️ الأيقونة ما انقبلت (${lastIconError.replace(/</g,"&lt;")}) — <a href="${BRAND_ICON_URL}" target="_blank" rel="noopener">افتح رابط الأيقونة</a></p>` : "");
    }catch(e){
      offerMsg.innerHTML = `<p class="err">تعذر النشر: ${(e && e.code) || "غير معروف"}</p>`;
    }
    btn.disabled = false; btn.textContent = "نشر العرض لكل العملاء";
  };
}

function buildDistributionReport(cardsDocs){
  const buckets = { 0:[], 1:[], 2:[], 3:[] };
  cardsDocs.forEach(d => {
    const v = d.data();
    const s = Math.min(v.sinceReward||0, REWARD_EVERY);
    if(buckets[s]) buckets[s].push(d.id);
  });
  const listHtml = (arr) => arr.length
    ? `<div class="customer-list">${arr.map(p=>`<div>${p}</div>`).join("")}</div>`
    : `<p class="muted" style="margin:6px 0 0">لا يوجد</p>`;

  return `
    <table class="dist-table">
      <tr><td>عملاء بثلاث زيارات (غسلتهم الجاية مجانية)</td><td>${buckets[3].length}</td></tr>
      <tr><td>عملاء بزيارتين</td><td>${buckets[2].length}</td></tr>
      <tr><td>عملاء بزيارة واحدة</td><td>${buckets[1].length}</td></tr>
      <tr><td>عملاء بلا زيارات حالية (بدأوا من جديد)</td><td>${buckets[0].length}</td></tr>
    </table>
    <details style="margin-top:8px">
      <summary class="muted" style="cursor:pointer">عرض القوائم بالأرقام</summary>
      <p class="muted" style="margin:8px 0 2px">ثلاث زيارات (الجاية مجانية):</p>${listHtml(buckets[3])}
      <p class="muted" style="margin:8px 0 2px">زيارتين:</p>${listHtml(buckets[2])}
      <p class="muted" style="margin:8px 0 2px">زيارة واحدة:</p>${listHtml(buckets[1])}
      <p class="muted" style="margin:8px 0 2px">بلا زيارات حالية:</p>${listHtml(buckets[0])}
    </details>
  `;
}

function buildTypeSizeBreakdown(docs){
  const t = { "خارجي":0, "خارجي وداخلي":0 };
  const legacyType = { "داخلي":"خارجي", "داخلي وخارجي":"خارجي وداخلي" }; // تسجيلات قبل تغيير الأسماء
  const s = { "سيدان":0, "وسط":0, "كبيرة":0 };
  docs.forEach(d => {
    const v = d.data ? d.data() : d;
    const wt = legacyType[v.washType] || v.washType;
    if(t[wt] !== undefined) t[wt]++;
    if(s[v.carSize] !== undefined) s[v.carSize]++;
  });
  return `
    <table class="dist-table">
      <tr><td>خارجي</td><td>${t["خارجي"]}</td></tr>
      <tr><td>خارجي وداخلي</td><td>${t["خارجي وداخلي"]}</td></tr>
      <tr><td>سيدان</td><td>${s["سيدان"]}</td></tr>
      <tr><td>وسط</td><td>${s["وسط"]}</td></tr>
      <tr><td>كبيرة</td><td>${s["كبيرة"]}</td></tr>
    </table>
  `;
}

async function loadOwnerStats(wrap){
  const body = wrap.querySelector("#ownerBody");
  try{
    const now = new Date();
    const todayKey = fmtDate(now);
    const defaultMonth = monthKey(now);
    const sow = startOfWeek(now);
    const weekKeys = []; for(let i=0;i<7;i++){ const d=new Date(sow); d.setDate(sow.getDate()+i); weekKeys.push(fmtDate(d)); }
    const weekStart = weekKeys[0], weekEnd = weekKeys[6];

    const visitsCol = collection(firestore,"visits");
    const [todaySnap, weekSnap, monthSnap, cardsSnap] = await Promise.all([
      getDocs(query(visitsCol, where("dateKey","==",todayKey))),
      getDocs(query(visitsCol, where("dateKey",">=",weekStart), where("dateKey","<=",weekEnd))),
      getDocs(query(visitsCol, where("month","==",defaultMonth))),
      getDocs(collection(firestore,"cards"))
    ]);

    const todayCount = todaySnap.size, weekTotal = weekSnap.size, totalCards = cardsSnap.size;
    const todayBreakdownHtml = buildTypeSizeBreakdown(todaySnap.docs);
    const distributionHtml = buildDistributionReport(cardsSnap.docs);
    const monthCache = { [defaultMonth]: monthSnap.docs };
    let currentMonth = defaultMonth;

    const dayFilter = wrap.querySelector("#dayFilter");
    const dayResult = wrap.querySelector("#dayResult");
    dayFilter.onchange = async () => {
      const v = readDateRow(dayFilter);
      if(!v.d){ dayResult.innerHTML = ""; return; }
      const picked = new Date(Number(v.y), Number(v.m)-1, Number(v.d));
      if(picked.getMonth() !== Number(v.m)-1){ dayResult.innerHTML = `<p class="err center">هذا التاريخ غير موجود</p>`; return; }
      const dk = fmtDate(picked);
      dayResult.innerHTML = `<p class="muted center">جاري التحميل...</p>`;
      try{
        const daySnap = await getDocs(query(visitsCol, where("dateKey","==",dk)));
        dayResult.innerHTML = `
          <p class="center" style="font-weight:800; font-size:1.2rem; color:var(--brand)">${daySnap.size}</p>
          <p class="muted center" style="margin:0 0 8px">إجمالي غسلات هذا اليوم</p>
          ${buildTypeSizeBreakdown(daySnap.docs)}
        `;
      }catch(e){ dayResult.innerHTML = `<p class="err center">تعذر التحميل</p>`; }
    };

    const renderMonthPart = () => {
      const docs = monthCache[currentMonth] || [];
      const monthTotal = docs.length;
      const weekdayCounts = [0,0,0,0,0,0,0]; const hourCounts = new Array(24).fill(0);
      docs.forEach(d => { const v=d.data(); if(typeof v.weekday==="number") weekdayCounts[v.weekday]++; if(typeof v.hour==="number") hourCounts[v.hour]++; });
      const maxWeekday = Math.max(1, ...weekdayCounts);
      let weekdayRows = "";
      weekdayCounts.forEach((c,i) => { const pct=Math.round((c/maxWeekday)*100); weekdayRows += `<div class="bar-row"><span class="bar-label">${EN_WEEKDAYS[i]}</span><div class="bar-track"><div class="bar-fill ${c===maxWeekday&&c>0?"max":""}" style="width:${pct}%"></div></div><span class="bar-value">${c}</span></div>`; });
      const topHours = hourCounts.map((c,h)=>({h,c})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
      const maxHour = topHours.length?topHours[0].c:1;
      let hourRows = topHours.length ? "" : `<p class="muted center">لا توجد بيانات كافية لهذا الشهر</p>`;
      topHours.forEach((x,i)=>{ const pct=Math.round((x.c/maxHour)*100); hourRows += `<div class="bar-row"><span class="bar-label">${fmtHour(x.h)}</span><div class="bar-track"><div class="bar-fill ${i===0?"max":""}" style="width:${pct}%"></div></div><span class="bar-value">${x.c}</span></div>`; });
      const monthName = monthLabel(currentMonth);

      body.innerHTML = `
        <div class="card">
          <p class="section-title">التقرير اليومي (يبدأ من جديد كل يوم 12 بالليل)</p>
          <div class="stats-grid">
            <div class="stat-box"><div class="stat-num">${todayCount}</div><div class="stat-label">اليوم</div></div>
            <div class="stat-box"><div class="stat-num">${weekTotal}</div><div class="stat-label">هذا الأسبوع</div></div>
            <div class="stat-box"><div class="stat-num">${monthTotal}</div><div class="stat-label">${monthName}</div></div>
          </div>
          <p class="muted center" style="margin:8px 0 0">عدد العملاء المسجلين في نظام الولاء: ${totalCards}</p>
          <p class="section-title" style="margin-top:14px">تفاصيل اليوم</p>
          ${todayBreakdownHtml}
        </div>
        <div class="card">
          <p class="section-title">توزيع العملاء حسب عدد الزيارات</p>
          ${distributionHtml}
        </div>
        <div class="card"><p class="section-title">الأيام الأكثر ازدحامًا (${monthName})</p>${weekdayRows}</div>
        <div class="card"><p class="section-title">أكثر 5 ساعات ازدحامًا (${monthName})</p>${hourRows}</div>
      `;
    };
    renderMonthPart();

    const monthFilter = wrap.querySelector("#monthFilter");
    monthFilter.onchange = async () => {
      const v = readDateRow(monthFilter);
      const mk = v.y + "-" + pad(Number(v.m));
      currentMonth = mk;
      if(!monthCache[mk]){
        body.innerHTML = `<p class="muted center">جاري تحميل بيانات ${monthLabel(mk)}...</p>`;
        try{
          const snap = await getDocs(query(visitsCol, where("month","==",mk)));
          monthCache[mk] = snap.docs;
        }catch(e){ body.innerHTML = `<p class="err center">تعذر التحميل: ${(e && e.code) || "غير معروف"}</p>`; return; }
      }
      if(currentMonth === mk) renderMonthPart();
    };
  }catch(e){
    body.innerHTML = `<p class="err">تعذر تحميل الإحصائيات: ${(e && e.code) || "غير معروف"}</p>`;
  }
}

const _publicPhone = new URLSearchParams(location.search).get("phone");
if(_publicPhone){ renderCustomerView(normalizePhone(_publicPhone)); } else { render(); }
